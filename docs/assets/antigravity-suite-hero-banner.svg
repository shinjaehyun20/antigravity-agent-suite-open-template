<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Mesh Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1050" y1="0" x2="1050" y2="320"/>
  </g>

  <!-- Glowing Abstract Circles -->
  <circle cx="1020" cy="80" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="240" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>

  <!-- Badge Top -->
  <rect x="80" y="45" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="98" cy="61" r="5" fill="#10b981"/>
  <text x="112" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">28 MASTER SUBAGENTS</text>

  <!-- Main Headline -->
  <text x="80" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Antigravity Master Agent Suite
  </text>
  
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="url(#accent-cyan)">
    Autonomous Multi-Agent Orchestration • Enterprise SDLC • Zero Self-Praise
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 210)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="10" fill="#1f293d" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ 28 Subagents</text>
    
    <!-- Pill 2 -->
    <rect x="195" y="0" width="220" height="42" rx="10" fill="#2e1065" stroke="#c084fc" stroke-width="1"/>
    <text x="215" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#c084fc">🛡 Zero Self-Praise</text>
    
    <!-- Pill 3 -->
    <rect x="430" y="0" width="230" height="42" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="450" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#34d399">🔄 Dynamic Handoffs</text>
    
    <!-- Pill 4 -->
    <rect x="675" y="0" width="230" height="42" rx="10" fill="#451a03" stroke="#fb923c" stroke-width="1"/>
    <text x="695" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#fb923c">📊 KOSA FP &amp; RFP Engine</text>
  </g>
</svg>
