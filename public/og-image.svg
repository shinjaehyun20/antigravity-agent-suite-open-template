<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
    <!-- Background -->
    <rect width="1200" height="630" fill="#0d1117" />

    <!-- Grid Pattern -->
    <defs>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#161b22" stroke-width="2" />
        </pattern>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4b0082;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)" />

    <!-- Title Section -->
    <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
        Antigravity
    </text>
    <text x="100" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#8a2be2">
        Master Agent Suite
    </text>

    <!-- Description -->
    <text x="100" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#8b949e">
        Autonomous Multi-Agent Suite for Enterprise SDLC
    </text>
    <text x="100" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#8b949e">
        Design, Procurement, &amp; Verification
    </text>

    <!-- Subagents Metric -->
    <g transform="translate(100, 530)">
        <rect width="180" height="50" rx="8" fill="#1f2428" stroke="#30363d" stroke-width="2"/>
        <circle cx="25" cy="25" r="8" fill="#2ea043" />
        <text x="45" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
            28 Subagents
        </text>
    </g>

    <!-- Verified Metric -->
    <g transform="translate(300, 530)">
        <rect width="160" height="50" rx="8" fill="#1f2428" stroke="#30363d" stroke-width="2"/>
        <path d="M18 25l4 4 10-10" fill="none" stroke="#2ea043" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="45" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
            Verified
        </text>
    </g>

    <!-- Abstract Logo / Graphic -->
    <g transform="translate(850, 200)">
        <circle cx="150" cy="150" r="120" fill="none" stroke="url(#grad1)" stroke-width="12" />
        <circle cx="150" cy="150" r="80" fill="none" stroke="#8a2be2" stroke-width="8" opacity="0.6"/>
        <circle cx="150" cy="150" r="40" fill="url(#grad1)" />
        <circle cx="150" cy="30" r="16" fill="#ffffff" />
        <circle cx="254" cy="210" r="12" fill="#ffffff" />
        <circle cx="46" cy="210" r="12" fill="#ffffff" />
    </g>
</svg>
